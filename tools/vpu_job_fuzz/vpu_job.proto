syntax = "proto3";

package vpu_job;

// VPU Command Buffer Header
message VpuCmdBufferHeader {
  uint32 cmd_buffer_size = 1;
  uint32 cmd_offset = 2;
  uint32 api_version = 3;
  uint32 reserved_0 = 4;
  uint64 descriptor_heap_base_address = 5;
  uint64 submission_timestamp = 6;
  uint64 fence_heap_base_address = 7;
  uint64 context_save_area_address = 8;
}

// Common command header shared by all commands
// NOTE: Original C format uses uint16, but proto3 only supports uint32.
// The actual binary format uses 2-byte fields, but we store as 4-byte.
// Conversion:
//   - Lifting: Read uint16 (2 bytes), store as uint32 (4 bytes)
//   - Lowering: Write as uint16 using only low 16 bits
message VpuCmdHeader {
  uint32 type = 1;   // Stored as 32 bits, binary uses 16 bits
  uint32 size = 2;   // Stored as 32 bits, binary uses 16 bits
}

// Resource descriptor
message VpuCmdResourceDescriptor {
  uint64 address = 1;
  uint32 width = 2;
  uint32 reserved_0 = 3;
}

// Copy command descriptor (37xx)
message VpuCmdCopyDescriptor37xx {
  uint64 reserved_0 = 1;
  uint64 reserved_1 = 2;
  uint64 src_address = 3;
  uint64 dst_address = 4;
  uint32 size = 5;
  uint32 reserved_2 = 6;
  uint32 reserved_3 = 7;
  uint32 reserved_4 = 8;
  uint32 reserved_5 = 9;
}

// Copy command descriptor (40xx)
message VpuCmdCopyDescriptor40xx {
  uint64 reserved_0 = 1;
  uint64 reserved_1 = 2;
  uint64 reserved_2 = 3;
  uint32 size = 4;
  uint32 reserved_3 = 5;
  uint64 reserved_4 = 6;
  uint64 src_address = 7;
  uint64 dst_address = 8;
}

// Copy command
message VpuCmdCopyBuffer {
  VpuCmdHeader header = 1;
  uint32 reserved_0 = 2;
  uint64 desc_start_offset = 3;
  uint32 desc_count = 4;
  uint32 reserved_1 = 5;
  oneof descriptors {
    VpuCmdCopyDescriptor37xx desc_37xx = 6;
    VpuCmdCopyDescriptor40xx desc_40xx = 7;
  }
}

// Memory fill command
message VpuCmdMemoryFill {
  VpuCmdHeader header = 1;
  uint32 reserved_0 = 2;
  uint64 start_address = 3;
  uint64 size = 4;
  uint32 fill_pattern = 5;
  uint32 reserved_1 = 6;
}

// Inference execute command
message VpuCmdInferenceExecute {
  VpuCmdHeader header = 1;
  uint32 reserved_0 = 2;
  uint64 inference_id = 3;
  VpuCmdResourceDescriptor host_mapped_inference = 4;
}

// Timestamp command
message VpuCmdTimestamp {
  VpuCmdHeader header = 1;
  uint32 type = 2;
  uint64 timestamp_address = 3;
}

// Fence command (wait/signal)
message VpuCmdFence {
  VpuCmdHeader header = 1;
  uint32 reserved_0 = 2;
  uint64 offset = 3;
  uint64 value = 4;
}

// Barrier command
message VpuCmdBarrier {
  VpuCmdHeader header = 1;
  uint32 reserved_0 = 2;
}

// Metric query command
message VpuCmdMetricQuery {
  VpuCmdHeader header = 1;
  uint32 metric_group_type = 2;
  uint64 metric_data_address = 3;
}

// NOP command
message VpuCmdNop {
  VpuCmdHeader header = 1;
}

// Command variants
message VpuCommand {
  oneof cmd {
    VpuCmdNop nop = 1;
    VpuCmdTimestamp timestamp = 2;
    VpuCmdFence fence = 3;
    VpuCmdBarrier barrier = 4;
    VpuCmdMetricQuery metric_query = 5;
    VpuCmdMemoryFill memory_fill = 6;
    VpuCmdCopyBuffer copy = 7;
    VpuCmdInferenceExecute inference_execute = 8;
  }
}

// VpuTaskReference structure (24 bytes)
message VpuTaskReference {
  uint64 address = 1;  // VPU address of referenced structure
  uint32 count = 2;    // Number of entries
  uint32 offset = 3;   // Offset from address
}

// ResourceRequirements structure (12 bytes)
message VpuResourceRequirements {
  uint32 nn_slice_length = 1;  // Network slice length
  uint32 pad_0 = 2;          // Padding (6 bytes, stored as 2 uint32)
  uint32 nn_slice_count = 3;  // Number of network slices (1 byte)
  uint32 nn_barriers = 4;    // Number of barriers (1 byte)
}

// VpuPerformanceMetrics structure (320 bytes)
message VpuPerformanceMetrics {
  uint32 freq_base = 1;          // Base frequency in MHz
  uint32 freq_step = 2;          // Frequency step in MHz
  uint32 bw_base = 3;            // Base bandwidth in MB/s
  uint32 bw_step = 4;            // Bandwidth step in MB/s
  repeated uint64 ticks = 5;      // Execution time ticks table [5][5]
  repeated float scalability = 6;   // Scalability table [5][5]
  float activity_factor = 7;         // Activity factor
}

// VpuHostParsedInference structure (384 bytes)
message VpuHostParsedInference {
  uint64 reserved = 1;                            // 8 bytes
  VpuResourceRequirements resource_requirements = 2;  // 12 bytes
  uint32 pad_0 = 3;                             // 4 bytes
  VpuPerformanceMetrics performance_metrics = 4;       // 320 bytes
  VpuTaskReference mapped = 5;                  // 24 bytes (VpuTaskReference<VpuMappedInference>)
}

// VpuMappedInference structure (448 bytes)
message VpuMappedInference {
  uint32 vpu_nnrt_api_ver = 1;         // 4 bytes
  uint32 pad_0 = 2;                     // 4 bytes
  uint64 reserved_0 = 3;                // 8 bytes
  VpuTaskCounts task_storage_counts = 4;  // 28 bytes
  uint32 task_storage_size = 5;         // 4 bytes
  VpuTaskReference dma_tasks = 6;        // 24 bytes x VPU_MAX_DMA_ENGINES
  VpuTaskReference invariants = 7;        // 24 bytes
  VpuTaskReference variants = 8;          // 24 bytes
  VpuTaskReference act_kernel_ranges = 9; // 24 bytes
  VpuTaskReference act_kernel_invocations = 10; // 24 bytes
  VpuTaskReference barrier_configs = 11;  // 24 bytes
  VpuNNShaveRuntimeConfigs shv_rt_configs = 12; // 4 bytes
  uint32 pad_1 = 13;                    // 4 bytes
  VpuTaskReference reserved_1 = 14;     // 24 bytes
  uint32 pad_2 = 15;                    // 24 bytes
}

// VpuTaskCounts structure (28 bytes)
message VpuTaskCounts {
  uint32 dpu_invariant_count = 1;   // 4 bytes
  uint32 dpu_variant_count = 2;     // 4 bytes
  uint32 act_kernel_count = 3;        // 4 bytes
  uint32 act_shv_kernel_count = 4;   // 4 bytes
  uint32 dma_task_count = 5;          // 4 bytes
  uint32 barrier_count = 6;          // 4 bytes
  uint32 pad_0 = 7;                  // 4 bytes
}

// VpuNNShaveRuntimeConfigs structure (4 bytes)
message VpuNNShaveRuntimeConfigs {
  uint32 value = 1;  // 4 bytes
}

// Command Buffer metadata
message CommandHeaderPrefix {
  bytes context_save_area = 1;  // 64 bytes
  uint64 fence_value = 2;
  repeated uint64 reserved = 3;  // 7 * uint64
}

// Fence sync commands (2 internal fences)
message VpuInternalFenceSync {
  repeated VpuCmdFence internal_fences = 1;
}

// Descriptor heap entry
message VpuDescriptorHeapEntry {
  uint32 entry_type = 1;      // Type of descriptor (0x100-0x202)
  uint32 reserved_0 = 2;
  uint64 address = 3;          // VPU address
  uint32 size = 4;             // Size in bytes
  uint32 reserved_1 = 5;
  bytes data = 6;               // Raw descriptor data (for unknown types)
}

// Full command buffer
message VpuCommandBuffer {
  CommandHeaderPrefix prefix = 1;
  VpuCmdBufferHeader header = 2;
  VpuInternalFenceSync internal_sync = 3;
  repeated VpuCommand commands = 4;
  // Descriptor heap is separate from commands
}

// Buffer object information
message VpuBuffer {
  uint32 index = 1;
  uint32 handle = 2;
  uint64 vpu_addr = 3;
  uint64 size = 4;
  uint64 mmap_offset = 5;
  uint32 flags = 6;
  oneof content {
    bytes raw_data = 7;                    // Raw buffer data (hex-encoded or binary)
    VpuHostParsedInference host_parsed_inference = 8;  // Buffer 1: Host Parsed Inference
    VpuMappedInference mapped_inference = 9;         // Could be Buffer X: Mapped Inference
  }
}

// VPU Job submission
message VpuJob {
  uint32 vpu_fd = 1;
  uint32 cmdq_id = 2;
  uint64 buffers_ptr = 3;
  uint32 buffer_count = 4;
  repeated VpuBuffer buffers = 5;
  uint32 commands_offset = 6;
  uint32 preempt_buffer_index = 7;
}

// Command type enum for reference
enum VpuCmdType {
  UNKNOWN = 0x0000;
  NOP = 0x0001;
  TIMESTAMP = 0x0100;
  FENCE_WAIT = 0x0101;
  FENCE_SIGNAL = 0x0102;
  BARRIER = 0x0103;
  METRIC_QUERY_BEGIN = 0x0104;
  METRIC_QUERY_END = 0x0105;
  MEMORY_FILL = 0x0202;
  COPY = 0x0302;
  INFERENCE_EXECUTE = 0x0306;
}

// Descriptor type enum
enum VpuDescriptorType {
  UNKNOWN_DESC = 0x000;
  SCRATCH = 0x100;
  METADATA = 0x101;
  WEIGHTS = 0x102;
  KERNEL_DATA = 0x103;
  INPUT = 0x200;
  OUTPUT = 0x201;
  PROFILING_OUTPUT = 0x202;
}
